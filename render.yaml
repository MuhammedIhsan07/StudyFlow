services:
  - type: web
    name: studyflow
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: STUDYFLOW_DATA_DIR
        value: /var/data
      - key: STUDYFLOW_WEB_DIR
        value: /app/web
    disk:
      name: studyflow-data
      mountPath: /var/data
      sizeGB: 1
